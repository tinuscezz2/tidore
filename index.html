  --accent:#E60000;
  --accent-soft:#FFE8E8;
  --green:#16A34A;
  --amber:#FFC107;
  --red:#E60000;
  --bg:#F5F5F5;
  --surface:#FFFFFF;
  --text:#1A1A1A;
  --muted:#667085;
  --line:#E4E7EC;
  --telkomsel:#E60000;
  --telkomsel-highlight:#FF6B6B;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#1A0505;
    --surface:#2A0A0A;
    --text:#FFF2F2;
    --muted:#E5B8B8;
    --line:#4A1515;
  }
}

*{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif
}

body{
  margin:0;
  background:#F5F5F5
}

input,select,textarea{
  font-family:inherit
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.range{
  accent-color:var(--accent)
}

.telkomsel-gradient{
  background:linear-gradient(135deg,#FF0000 0%,#E60000 35%,#B3001B 70%,#7A0000 100%);
  color:#fff
}

.telkomsel-gradient-soft{
  background:linear-gradient(135deg,#FF2D2D,#C80000);
  color:#fff
}

.telkomsel-header{
  background:radial-gradient(circle at 88% -10%,rgba(255,255,255,.28) 0 16%,transparent 17%),radial-gradient(circle at 6% 115%,rgba(255,255,255,.18) 0 22%,transparent 23%),radial-gradient(circle at 58% 45%,rgba(255,255,255,.08) 0 30%,transparent 31%),linear-gradient(135deg,#FF0000 0%,#E60000 35%,#B3001B 70%,#7A0000 100%);
  color:#fff
}

.telkomsel-hero{
  background:radial-gradient(circle at 92% 0%,rgba(255,255,255,.30) 0 18%,transparent 19%),radial-gradient(circle at 8% 108%,rgba(255,255,255,.16) 0 26%,transparent 27%),radial-gradient(circle at 62% 50%,rgba(255,255,255,.07) 0 34%,transparent 35%),linear-gradient(135deg,#FF0000 0%,#E60000 35%,#B3001B 70%,#7A0000 100%);
  color:#fff
}

.placeholder\:text-\[\#666666\]::-moz-placeholder{
  --tw-text-opacity: 1;
  color: rgb(102 102 102 / var(--tw-text-opacity, 1));
}

.placeholder\:text-\[\#666666\]::placeholder{
  --tw-text-opacity: 1;
  color: rgb(102 102 102 / var(--tw-text-opacity, 1));
}

.last\:border-0:last-child{
  border-width: 0px;
}

.hover\:bg-\[\#FFF1F1\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(255 241 241 / var(--tw-bg-opacity, 1));
}

.disabled\:bg-\[\#F3F4F6\]:disabled{
  --tw-bg-opacity: 1;
  background-color: rgb(243 244 246 / var(--tw-bg-opacity, 1));
}

.disabled\:text-\[\#666666\]:disabled{
  --tw-text-opacity: 1;
  color: rgb(102 102 102 / var(--tw-text-opacity, 1));
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}
