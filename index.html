  accent-color:var(--accent)
}

.telkomsel-gradient{
  background:#E60000;
  color:#fff
}

.telkomsel-gradient-soft{
  background:#E60000;
  color:#fff
}

.telkomsel-header{
  background:linear-gradient(135deg,#FF0000 0%,#FF6A00 45%,#7A0000 100%);
  color:#fff
}

.telkomsel-hero{
  background:linear-gradient(135deg,#FF0000 0%,#FF6A00 45%,#7A0000 100%);
  color:#fff
}

.moti-card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.06)
}

.moti-input{
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px
}

.placeholder\:text-\[\#666666\]::-moz-placeholder {
  --tw-text-opacity: 1;
  color: rgb(102 102 102 / var(--tw-text-opacity, 1));
}

.placeholder\:text-\[\#666666\]::placeholder {
  --tw-text-opacity: 1;
  color: rgb(102 102 102 / var(--tw-text-opacity, 1));
}

.last\:border-0:last-child {
  border-width: 0px;
}

.disabled\:opacity-50:disabled {
  opacity: 0.5;
}

.disabled\:opacity-60:disabled {
  opacity: 0.6;
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
